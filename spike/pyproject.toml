[project]
name = "dtforget-spike"
version = "0.0.1"
description = "Phase 0 : spike de faisabilité IA (séparation voix, paroles, alignement)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.7",
  "torchaudio>=2.7",
  "audio-separator[gpu]>=0.30",
  "faster-whisper>=1.1",
  "stable-ts>=2.19",
  "rapidfuzz>=3.10",
  "soundfile>=0.12",
  "numpy",
  "requests",
  "audioread>=3.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
