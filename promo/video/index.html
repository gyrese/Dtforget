<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0a0c14; }
      #root { width: 100%; height: 100%; position: relative; }
      #ground { position: absolute; inset: 0; background: #0a0c14; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.5" data-width="1080" data-height="1920">
      <div id="ground"></div>
      <div id="trou" data-composition-id="trou" data-composition-src="compositions/trou.html" data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="salon" data-composition-id="salon" data-composition-src="compositions/salon.html" data-start="6" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="tel" data-composition-id="tel" data-composition-src="compositions/tel.html" data-start="9" data-duration="4.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-start="13.3" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="podium" data-composition-id="podium" data-composition-src="compositions/podium.html" data-start="17.8" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="fin" data-composition-id="fin" data-composition-src="compositions/fin.html" data-start="20.3" data-duration="5.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
