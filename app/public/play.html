<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/brand-mark.svg" type="image/svg+xml">
<title>N'oubliez pas les paroles · Téléphone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Unbounded:wght@700;900&display=swap">
<style>
:root{--pink:#ff3d9a;--cyan:#27e8ff;--sun:#ffd23f;--soft:#c4b5de;--ink:#14061f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0c0319;color:#fff;font-family:Outfit,system-ui,sans-serif}
body{background:radial-gradient(120% 60% at 85% 0%,#4b0f6e 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,#0a4a6b 0%,transparent 60%),linear-gradient(180deg,#1a0636 0%,#0c0319 100%);min-height:100vh}
.screen{display:none;flex-direction:column;gap:22px;min-height:100vh;padding:52px 24px 30px;max-width:460px;margin:0 auto}
.screen.on{display:flex}
.brand{font-family:Unbounded,sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sun)}
h1{margin:0;font-family:Unbounded,sans-serif;font-weight:900;font-size:36px;line-height:1.05;text-transform:uppercase}
.lead{margin:0;font-size:17px;line-height:1.45;color:#ddd2ee}
.lbl{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.inp{width:100%;min-height:64px;padding:14px 18px;border-radius:24px;border:2px solid #4a3a6e;background:rgba(10,3,25,.7);color:#fff;font-size:22px;font-weight:600;outline:0}
.inp::placeholder{color:#b3a4cf;font-weight:400}
.inp:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(39,232,255,.25)}
.inp.code{font-family:Unbounded,sans-serif;font-weight:900;font-size:32px;letter-spacing:.35em;text-transform:uppercase;text-align:center}
.field{display:flex;flex-direction:column;gap:8px}
.btn{min-height:68px;width:100%;border:0;border-radius:34px;cursor:pointer;color:var(--ink);background:linear-gradient(90deg,var(--sun),#ff8a3d 55%,var(--pink));font-family:Unbounded,sans-serif;font-weight:900;font-size:17px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 10px 30px rgba(255,61,154,.45)}
.btn:disabled{opacity:.45;cursor:default}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:4px solid #fff;outline-offset:4px}
.err{padding:14px 16px;border-radius:20px;background:#4a0d2a;border:2px solid var(--pink);color:#ffe0ec;font-size:16px;font-weight:600}
.card{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:2px solid rgba(255,255,255,.18);border-radius:28px;padding:22px 20px}
.hint{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
.big{font-family:Unbounded,sans-serif;font-weight:900;font-size:26px;line-height:1.3;margin-top:10px}
.status{text-align:center;color:var(--cyan);font-size:18px;font-weight:700}
.pts{font-family:Unbounded,sans-serif;font-weight:900;font-size:56px;color:var(--cyan);text-align:center}
.wait-dot{display:flex;gap:8px;justify-content:center}
.wait-dot i{width:12px;height:12px;border-radius:50%;background:var(--pink);animation:beat .8s ease-in-out infinite alternate}
.wait-dot i:nth-child(2){animation-delay:.2s;background:var(--sun)}
.wait-dot i:nth-child(3){animation-delay:.4s;background:var(--cyan)}
@keyframes beat{from{transform:scale(1)}to{transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="/play-redesign.css"></head>
<body>

<section class="screen on" id="v-join">
  <div class="brand">N'oubliez pas les paroles</div>
  <div>
    <h1>Rejoins<br>le salon</h1>
  </div>
  <form id="join-form" style="display:flex;flex-direction:column;gap:18px">
    <label class="field">
      <span class="lbl">Code du salon</span>
      <input class="inp code" id="code" type="text" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters">
    </label>
    <label class="field">
      <span class="lbl">Votre pseudo</span>
      <input class="inp" id="name" type="text" maxlength="16" placeholder="Votre prénom" autocomplete="nickname">
    </label>
    <div class="err" id="join-err" role="alert" style="display:none"></div>
    <button class="btn" id="join-btn" type="submit">Rejoindre</button>
  </form>
</section>

<section class="screen" id="v-wait">
  <div class="brand" id="wait-name"></div>
  <div class="card" style="text-align:center">
    <div class="hint">Salon <span id="wait-code"></span></div>
    <div class="big" id="wait-msg">En attente du départ…</div>
  </div>
  <div class="wait-dot" aria-hidden="true"><i></i><i></i><i></i></div>
</section>

<section class="screen" id="v-answer">
  <div class="brand" id="ans-round">Manche</div>
  <div class="card">
    <div class="big">Complétez les paroles</div>
  </div>
  <form id="answer-form" style="display:flex;flex-direction:column;gap:16px">
    <label class="field">
      <span class="lbl">Votre réponse</span>
      <input class="inp" id="answer" type="text" maxlength="120" placeholder="Le mot manquant" autocomplete="off">
    </label>
    <button class="btn" id="answer-btn" type="submit">Envoyer</button>
  </form>
  <div class="status" id="ans-status" role="status" style="display:none">Réponse envoyée.</div>
</section>

<section class="screen" id="v-result">
  <div class="brand">Manche terminée</div>
  <div class="card" style="text-align:center">
    <div class="hint">Vous avez gagné</div>
    <div class="pts" id="res-pts">0</div>
    <div class="big" id="res-answer"></div>
  </div>
  <p class="lead" style="text-align:center">Manche suivante…</p>
</section>

<section class="screen" id="v-over">
  <div class="brand">Partie terminée</div>
  <h1 id="over-title">Merci</h1>
  <div class="card" style="text-align:center">
    <div class="hint">Votre score</div>
    <div class="pts" id="over-pts">0</div>
  </div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const socket = io();
const codeFromLink = new URLSearchParams(location.search).get("code");
if (/^[A-Z]{4}$/.test(codeFromLink || "")) $("code").value = codeFromLink;
let myName = "";
let myCode = "";
let answered = false;

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
}

$("code").addEventListener("input", (e) => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, "");
});

$("join-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const code = $("code").value.trim().toUpperCase();
  const name = $("name").value.trim();
  const err = $("join-err");
  err.style.display = "none";
  if (code.length !== 4) { err.textContent = "Le code fait 4 lettres."; err.style.display = "block"; return; }
  if (!name) { err.textContent = "Entrez un pseudo."; err.style.display = "block"; return; }
  $("join-btn").disabled = true;
  socket.emit("player:join", { code, name }, (res) => {
    $("join-btn").disabled = false;
    if (!res.ok) { err.textContent = res.error; err.style.display = "block"; return; }
    myName = name;
    myCode = res.code;
    try { localStorage.setItem("dtf-session", JSON.stringify({ code: res.code, token: res.token, name })); } catch (_) {}
    $("wait-name").textContent = myName;
    $("wait-code").textContent = myCode;
    show("v-wait");
  });
});

function savedSession() {
  try { return JSON.parse(localStorage.getItem("dtf-session") || "null"); } catch (_) { return null; }
}

function forgetSession() {
  try { localStorage.removeItem("dtf-session"); } catch (_) {}
}

// Reprend la partie après un rechargement ou une coupure réseau (jeton gardé dans le téléphone).
function resumeSession() {
  const s = savedSession();
  if (!s || !s.token) return;
  socket.emit("player:resume", { code: s.code, token: s.token }, (res) => {
    if (!res || !res.ok) { forgetSession(); return; }
    myName = res.name;
    myCode = s.code;
    $("wait-name").textContent = myName;
    $("wait-code").textContent = myCode;
    answered = res.answered;
    if (res.answering) {
      if (!answered) { show("v-answer"); $("answer-btn").disabled = false; $("answer").focus(); }
      else { show("v-answer"); $("ans-status").style.display = "block"; $("answer-btn").disabled = true; }
      $("ans-round").textContent = "Manche " + res.round + " / " + res.total;
    } else if (res.state === "over") {
      show("v-over");
    } else {
      show("v-wait");
      const msgs = { lobby: "En attente du départ…", reveal: "Manche terminée. La suivante arrive bientôt…" };
      $("wait-msg").textContent = msgs[res.state] || "Écoutez l'écran principal…";
    }
  });
}

socket.on("connect", resumeSession);

socket.on("round:intro", ({ round, total }) => {
  answered = false;
  $("ans-round").textContent = "Manche " + round + " / " + total;
  $("answer").value = "";
  $("answer-btn").disabled = false;
  $("ans-status").style.display = "none";
  show("v-wait");
  $("wait-msg").textContent = "Écoutez l'écran principal…";
});

socket.on("answer:open", () => {
  if (answered) return;
  show("v-answer");
  $("answer").focus();
});

$("answer-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("answer").value.trim();
  if (!text) return;
  $("answer-btn").disabled = true;
  socket.emit("player:answer", { text }, (res) => {
    if (res && res.ok) {
      answered = true;
      $("ans-status").style.display = "block";
    } else {
      $("answer-btn").disabled = false;
    }
  });
});

socket.on("reveal", ({ answer, ranking }) => {
  const me = ranking.find((r) => r.name === myName);
  $("res-pts").textContent = "+" + (me ? me.points : 0);
  $("res-answer").textContent = "Le mot était : " + answer;
  show("v-result");
});

socket.on("game:over", (list) => {
  const me = list.find((p) => p.name === myName);
  $("over-pts").textContent = (me ? me.score : 0) + " pts";
  const rank = list.findIndex((p) => p.name === myName) + 1;
  $("over-title").textContent = rank ? "Vous êtes " + rank + " / " + list.length : "Merci";
  show("v-over");
});

socket.on("room:closed", () => {
  forgetSession();
  $("wait-msg").textContent = "Le salon a été fermé.";
  show("v-wait");
});
</script>
</body>
</html>
