<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/brand-mark.svg" type="image/svg+xml">
<title>N'oubliez pas les paroles · Téléphone</title>
<link rel="stylesheet" href="/plateau.css">
<style>
:root{--pink:#ff3d9a;--cyan:#27e8ff;--sun:#ffd23f;--soft:#c4b5de;--ink:#14061f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0c0319;color:#fff;font-family:Outfit,system-ui,sans-serif}
body{background:radial-gradient(120% 60% at 85% 0%,#4b0f6e 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,#0a4a6b 0%,transparent 60%),linear-gradient(180deg,#1a0636 0%,#0c0319 100%);min-height:100vh}
.screen{display:none;flex-direction:column;gap:22px;min-height:100vh;padding:52px 24px 30px;max-width:460px;margin:0 auto}
.screen.on{display:flex}
.brand{font-family:Unbounded,sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sun)}
h1{margin:0;font-family:Unbounded,sans-serif;font-weight:900;font-size:36px;line-height:1.05;text-transform:uppercase}
.lead{margin:0;font-size:17px;line-height:1.45;color:#ddd2ee}
.lbl{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.inp{width:100%;min-height:64px;padding:14px 18px;border-radius:24px;border:2px solid #4a3a6e;background:rgba(10,3,25,.7);color:#fff;font-size:22px;font-weight:600;outline:0}
.inp::placeholder{color:#b3a4cf;font-weight:400}
.inp:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(39,232,255,.25)}
.inp.code{font-family:Unbounded,sans-serif;font-weight:900;font-size:32px;letter-spacing:.35em;text-transform:uppercase;text-align:center}
.field{display:flex;flex-direction:column;gap:8px}
.btn{min-height:68px;width:100%;border:0;border-radius:34px;cursor:pointer;color:var(--ink);background:linear-gradient(90deg,var(--sun),#ff8a3d 55%,var(--pink));font-family:Unbounded,sans-serif;font-weight:900;font-size:17px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 10px 30px rgba(255,61,154,.45)}
.btn:disabled{opacity:.45;cursor:default}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:4px solid #fff;outline-offset:4px}
.err{padding:14px 16px;border-radius:20px;background:#4a0d2a;border:2px solid var(--pink);color:#ffe0ec;font-size:16px;font-weight:600}
.card{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:2px solid rgba(255,255,255,.18);border-radius:28px;padding:22px 20px}
.hint{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
.big{font-family:Unbounded,sans-serif;font-weight:900;font-size:26px;line-height:1.3;margin-top:10px}
.status{text-align:center;color:var(--cyan);font-size:18px;font-weight:700}
.pts{font-family:Unbounded,sans-serif;font-weight:900;font-size:56px;color:var(--cyan);text-align:center}
.wait-dot{display:flex;gap:8px;justify-content:center}
.wait-dot i{width:12px;height:12px;border-radius:50%;background:var(--pink);animation:beat .8s ease-in-out infinite alternate}
.wait-dot i:nth-child(2){animation-delay:.2s;background:var(--sun)}
.wait-dot i:nth-child(3){animation-delay:.4s;background:var(--cyan)}
@keyframes beat{from{transform:scale(1)}to{transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.connection-note{position:fixed;z-index:5;top:env(safe-area-inset-top);left:0;right:0;margin:0;padding:9px 16px;background:#342441;color:#fff;text-align:center;font-weight:700}
</style>
<link rel="stylesheet" href="/play-redesign.css"></head>
<body>
<p class="connection-note" id="connection-note" role="status" hidden></p>

<section class="screen on" id="v-join">
  <div class="brand brand-intro"><img class="brand-logo" src="/assets/brand-logo.svg" alt="DtForget" width="322" height="64"><span class="brand-caption">N'oubliez pas les paroles</span></div>
  <div>
    <h1>Rejoins<br>le salon</h1>
  </div>
  <form id="join-form" style="display:flex;flex-direction:column;gap:18px">
    <label class="field">
      <span class="lbl">Code du salon</span>
      <input class="inp code" id="code" type="text" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters">
    </label>
    <label class="field">
      <span class="lbl">Votre pseudo</span>
      <input class="inp" id="name" type="text" maxlength="16" placeholder="Votre prénom" autocomplete="nickname">
    </label>
    <div class="err" id="join-err" role="alert" style="display:none"></div>
    <button class="btn" id="join-btn" type="submit">Rejoindre</button>
  </form>
</section>

<section class="screen" id="v-wait">
  <div class="brand" id="wait-name"></div>
  <div class="card" style="text-align:center">
    <div class="hint">Salon <span id="wait-code"></span></div>
    <div class="big" id="wait-msg">En attente du départ…</div>
  </div>
  <div class="wait-dot" aria-hidden="true"><i></i><i></i><i></i></div>
</section>

<section class="screen" id="v-answer">
  <div class="brand" id="ans-round">Manche</div>
  <div class="card">
    <div class="big">Complétez les paroles</div>
  </div>
  <form id="answer-form" style="display:flex;flex-direction:column;gap:16px">
    <label class="field">
      <span class="lbl">Votre réponse</span>
      <input class="inp" id="answer" type="text" maxlength="120" placeholder="Le mot manquant" autocomplete="off">
    </label>
    <button class="btn" id="answer-btn" type="submit">Envoyer</button>
  </form>
  <div class="status" id="ans-status" role="status" style="display:none">Réponse envoyée.</div>
</section>

<section class="screen" id="v-result">
  <div class="brand">Manche terminée</div>
  <div class="card" style="text-align:center">
    <div class="hint">Vous avez gagné</div>
    <div class="pts" id="res-pts">0</div>
    <div class="big" id="res-answer"></div>
  </div>
  <p class="lead" style="text-align:center">Manche suivante…</p>
</section>

<section class="screen" id="v-over">
  <div class="brand">Partie terminée</div>
  <h1 id="over-title">Merci</h1>
  <div class="card" style="text-align:center">
    <div class="hint">Votre score</div>
    <div class="pts" id="over-pts">0</div>
  </div>
  <a href="/play.html?new=1" class="lead">Rejoindre la prochaine partie</a>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/game-connection.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const socket = gameSocket();
const query = new URLSearchParams(location.search);
const codeFromLink = (query.get("code") || "").trim().toUpperCase();
const explicitCode = /^[A-Z]{4}$/.test(codeFromLink) ? codeFromLink : "";
const SESSION_KEY = "dtf-session";
let session = readStored(SESSION_KEY);
if (query.has("new") || (explicitCode && session?.code !== explicitCode)) session = null;
$("code").value = explicitCode || session?.code || "";
$("name").value = session?.name || "";
let state = null;
let request = null;
let retry;
let sending = null;
let queuedAnswer = session && readStored("dtf-submit:" + session.token);

function readStored(key) {
  try { return JSON.parse(localStorage.getItem(key) || "null"); } catch { return null; }
}

function store(key, value) {
  try {
    if (value === null) localStorage.removeItem(key);
    else localStorage.setItem(key, JSON.stringify(value));
  } catch {}
}

function draftKey(round) { return "dtf-draft:" + session.token + ":" + round; }

function queueAnswer(value) {
  queuedAnswer = value;
  if (session) store("dtf-submit:" + session.token, value);
}

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
}

function connectionNote(message) {
  $("connection-note").textContent = message;
  $("connection-note").hidden = !message;
  $("join-btn").disabled = Boolean(session) || !socket.connected;
  $("answer-btn").disabled = Boolean(message || queuedAnswer || !state?.answering || state.answered);
  $("answer").readOnly = Boolean(queuedAnswer || state?.answered);
}

function joinError(message) {
  $("join-err").textContent = message;
  $("join-err").style.display = message ? "block" : "none";
}

function applyState(next) {
  if (!session || next.code !== session.code) return;
  const previous = state;
  if (previous && previous.round !== next.round) {
    store(draftKey(previous.round), null);
    $("answer").value = "";
  }
  state = next;
  if (queuedAnswer && (!next.answering || next.answered || queuedAnswer.round !== next.round)) queueAnswer(null);
  $("wait-name").textContent = session.name;
  $("wait-code").textContent = session.code;
  $("ans-round").textContent = "Manche " + next.round + " / " + next.total;
  $("ans-status").style.display = next.answered ? "block" : "none";
  connectionNote("");
  if (next.answering) {
    if (!previous?.answering || previous.round !== next.round) $("answer").value = queuedAnswer?.text || readStored(draftKey(next.round)) || "";
    if (next.answered) store(draftKey(next.round), null);
    show("v-answer");
  } else if (next.result) {
    store(draftKey(next.round), null);
    $("res-pts").textContent = "+" + next.result.points;
    $("res-answer").textContent = "Le mot était : " + next.result.answer;
    show("v-result");
  } else if (next.rank) {
    store(draftKey(next.round), null);
    $("over-pts").textContent = next.score + " pts";
    $("over-title").textContent = "Vous êtes " + next.rank.position + " / " + next.rank.total;
    show("v-over");
  } else {
    $("wait-msg").textContent = next.state === "lobby" ? "En attente du départ." : "Écoutez l’écran principal.";
    show("v-wait");
  }
}

function returnToJoin(message, clear = true) {
  if (clear) {
    queueAnswer(null);
    if (session && state) store(draftKey(state.round), null);
    store(SESSION_KEY, null);
  }
  session = null;
  queuedAnswer = null;
  state = null;
  request = null;
  sending = null;
  clearTimeout(retry);
  show("v-join");
  joinError(message);
  connectionNote(socket.connected ? "" : "Connexion au jeu…");
}

function syncSession() {
  clearTimeout(retry);
  if (!socket.connected || request) return;
  if (!session) return connectionNote("");
  const attempt = request = { ...session };
  connectionNote(attempt.pending ? "Entrée dans le salon…" : "Reprise de votre partie…");
  socket.timeout(GAME_ACK_MS).emit(attempt.pending ? "player:join" : "player:resume", attempt, (error, res) => {
    if (request !== attempt) return;
    request = null;
    if (!socket.connected) return;
    if (error) {
      connectionNote("Le jeu ne répond pas encore. Nouvel essai…");
      retry = setTimeout(syncSession, 1000);
      return;
    }
    if (!res?.ok) {
      returnToJoin(res?.error || "Le salon a expiré. Vérifiez le code et rejoignez la partie.");
      return;
    }
    session = { code: res.code, token: res.token || attempt.token, name: res.name };
    store(SESSION_KEY, session);
    applyState(res);
    sendQueuedAnswer();
  });
}

$("code").addEventListener("input", (e) => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, "");
});

$("join-form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (session || !socket.connected) return;
  const code = $("code").value.trim().toUpperCase();
  const name = $("name").value.trim();
  if (code.length !== 4) return joinError("Le code fait 4 lettres.");
  if (!name) return joinError("Entrez un pseudo.");
  joinError("");
  session = { code, name, token: gameToken(), pending: true };
  history.replaceState(null, "", "/play.html?code=" + code);
  store(SESSION_KEY, session);
  syncSession();
});

socket.on("connect", syncSession);
socket.on("disconnect", () => {
  request = null;
  sending = null;
  connectionNote("Connexion interrompue. Reconnexion automatique…");
});
socket.on("connect_error", () => connectionNote("Serveur inaccessible pour le moment. Nouvel essai automatique…"));
reconnectWhenOnline(socket);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !socket.connected) socket.connect();
});

socket.on("round:intro", ({ round, total }) => {
  if (state) applyState({ code: session.code, state: "intro", round, total });
});

socket.on("answer:open", ({ round }) => {
  if (!state || state.round !== round) return;
  applyState({ ...state, state: "answering", answering: true });
  $("answer").focus();
});

$("answer").addEventListener("input", () => {
  if (session && state?.answering && !state.answered) store(draftKey(state.round), $("answer").value);
});

$("answer-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("answer").value.trim();
  if (!text || !socket.connected || request || queuedAnswer || !state?.answering || state.answered) return;
  queueAnswer({ text, round: state.round });
  sendQueuedAnswer();
});

function sendQueuedAnswer() {
  if (!queuedAnswer || !socket.connected || request || sending || !state?.answering || state.answered || state.round !== queuedAnswer.round) return;
  const attempt = sending = queuedAnswer;
  connectionNote("");
  socket.timeout(GAME_ACK_MS).emit("player:answer", attempt, (error, res) => {
    if (sending !== attempt) return;
    sending = null;
    if (!socket.connected || !session) return;
    if (error || !res?.state) return syncSession();
    queueAnswer(null);
    applyState(res.state);
  });
}

socket.on("player:state", applyState);
socket.on("room:closed", () => returnToJoin("Le salon a été fermé. Entrez le code de la prochaine partie."));
socket.on("player:replaced", () => returnToJoin("Votre place est ouverte sur un autre onglet ou appareil.", false));
connectionNote("Connexion au jeu…");
socket.connect();
</script>
</body>
</html>
