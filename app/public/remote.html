<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/brand-mark.svg" type="image/svg+xml">
<title>N'oubliez pas les paroles · Télécommande</title>
<link rel="stylesheet" href="/plateau.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--chalk);font-family:var(--f-text)}
body{background:var(--spotlight),var(--night);min-height:100dvh}
.screen{display:none;flex-direction:column;gap:22px;min-height:100dvh;max-width:460px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom))}
.screen.on{display:flex}
.brand{font:700 12px var(--f-text);letter-spacing:.2em;text-transform:uppercase;color:var(--spot);padding-bottom:16px;border-bottom:1px solid var(--rule)}
h1{margin:0;font:900 56px/.9 var(--f-display);text-transform:uppercase}
.lead{margin:0;color:var(--haze);line-height:1.6;font-size:17px}
.lbl{font:700 12px var(--f-text);letter-spacing:.18em;text-transform:uppercase;color:var(--haze)}
.field{display:flex;flex-direction:column;gap:8px}
.inp{width:100%;min-height:64px;background:var(--deck-2);color:var(--chalk);border:1px solid var(--rule-strong);border-radius:var(--r-md);font:700 30px var(--f-mono);letter-spacing:.4em;text-align:center;text-transform:uppercase;padding:12px 18px;outline:0}
.inp:focus{border-color:var(--led);box-shadow:0 0 0 3px #46d9ec40}
.btn{min-height:72px;width:100%;border:0;border-radius:var(--r-md);background:var(--spot);color:var(--on-spot);font:900 24px var(--f-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:var(--glow-spot)}
.btn:disabled{background:var(--deck-2);color:var(--haze);box-shadow:none;cursor:default}
.btn:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}
.err{margin:0;color:var(--live);font-weight:700;min-height:1.4em}
.card{background:var(--deck);border:1px solid var(--rule);border-radius:var(--r-lg);padding:20px}
.state{font:900 34px/1 var(--f-display);text-transform:uppercase;color:var(--led);margin:6px 0 0}
.song{font:700 20px/1.3 var(--f-text);margin-top:14px}.song small{display:block;color:var(--haze);font-weight:400;font-size:15px}
.answer{margin-top:14px;padding-top:14px;border-top:1px solid var(--rule);color:var(--spot);font:700 20px/1.35 var(--f-text)}
.stats{display:flex;gap:22px;margin-top:14px;color:var(--haze);font-size:15px}.stats b{color:var(--chalk);font:700 22px var(--f-mono)}
.grow{flex:1}
</style>
</head>
<body>
<p class="err" id="connection-note" role="status" style="text-align:center" hidden></p>
<section class="screen on" id="v-join">
  <div class="brand brand-intro"><img class="brand-logo" src="/assets/brand-logo.svg" alt="DtForget" width="322" height="64"><span class="brand-caption">Télécommande du présentateur</span></div>
  <h1>Prendre<br>la main</h1>
  <p class="lead">Le code du salon est affiché sur l’écran du salon.</p>
  <form id="join" style="display:flex;flex-direction:column;gap:18px">
    <label class="field"><span class="lbl">Code du salon</span><input class="inp" id="code" maxlength="4" autocomplete="off" autocapitalize="characters" required></label>
    <p class="err" id="join-err" role="alert"></p>
    <button class="btn" type="submit">Se connecter</button>
  </form>
</section>

<section class="screen" id="v-remote">
  <div class="brand" id="room">Salon</div>
  <div class="card" aria-live="polite">
    <div class="lbl" id="round"></div>
    <p class="state" id="state"></p>
    <div class="song" id="song" hidden></div>
    <div class="stats"><span><b id="players">0</b> joueurs</span><span><b id="answers">0</b> réponses</span></div>
    <div class="answer" id="answer" hidden></div>
  </div>
  <span class="grow"></span>
  <p class="lead" id="hint"></p>
  <button class="btn" id="action" disabled>Manche suivante →</button>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/game-connection.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const socket = gameSocket();
const q = new URLSearchParams(location.search);
let code = (q.get('code') || '').trim().toUpperCase();
try { code ||= sessionStorage.getItem('dtf-remote-code') || ''; } catch {}
$('code').value = code;
let current = null;
let joining = null;
let retry;
let acting = false;
const LABEL = { lobby: 'Salle d’attente', intro: 'Annonce de la chanson', playing: 'Extrait en cours', answering: 'Les joueurs répondent', reveal: 'Révélation', over: 'Partie terminée' };

function note(message = '') {
  $('connection-note').hidden = !message;
  $('connection-note').textContent = message;
  $('join').querySelector('button').disabled = Boolean(joining) || !socket.connected;
  if (message) $('action').disabled = true;
}

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

function clearRoom(message) {
  code = '';
  current = null;
  joining = null;
  clearTimeout(retry);
  try { sessionStorage.removeItem('dtf-remote-code'); } catch {}
  $('join-err').textContent = message;
  show('v-join');
  note();
}

function joinRoom() {
  clearTimeout(retry);
  if (!socket.connected || joining) return;
  if (!code) return note();
  const attempt = joining = { code };
  note('Connexion au salon…');
  socket.timeout(GAME_ACK_MS).emit('remote:join', attempt, (error, res) => {
    if (joining !== attempt) return;
    joining = null;
    if (!socket.connected) return;
    if (error) {
      note('Le jeu ne répond pas encore. Nouvel essai…');
      retry = setTimeout(joinRoom, 1000);
      return;
    }
    if (!res?.ok) return clearRoom(res?.error || 'Connexion impossible.');
    code = res.code;
    history.replaceState(null, '', '/remote.html?code=' + code);
    try { sessionStorage.setItem('dtf-remote-code', code); } catch {}
    $('room').textContent = 'Télécommande · salon ' + code;
    show('v-remote');
    note();
    render(res.state);
  });
}

$('join').onsubmit = (e) => {
  e.preventDefault();
  if (!socket.connected || joining) return;
  code = $('code').value.trim().toUpperCase();
  $('join-err').textContent = '';
  joinRoom();
};

function render(s) {
  if (!s || !code || joining) return;
  current = s;
  $('round').textContent = s.state === 'lobby' ? s.total + ' manches au programme' : 'Manche ' + s.round + ' / ' + s.total;
  $('state').textContent = LABEL[s.state] || s.state;
  $('song').hidden = s.state === 'lobby' || s.state === 'over';
  $('song').replaceChildren(s.title, Object.assign(document.createElement('small'), { textContent: s.film }));
  $('players').textContent = s.players;
  $('answers').textContent = s.answers;
  $('answer').hidden = !s.answer;
  $('answer').textContent = s.answer ? 'Réponse : ' + s.answer : '';
  const btn = $('action');
  let canAct = false;
  let hint = '';
  if (s.state === 'lobby') {
    btn.textContent = 'Lancer la partie →';
    canAct = s.connected > 0;
    if (!canAct) hint = 'En attente d’un premier joueur.';
  } else if (s.state === 'reveal') {
    btn.textContent = s.round >= s.total ? 'Classement final →' : 'Manche suivante →';
    canAct = true;
  } else if (s.state === 'over') {
    btn.textContent = 'Partie terminée';
    hint = 'Pour rejouer, créez un nouveau salon sur l’écran.';
  } else if (s.state === 'answering') {
    btn.textContent = 'Arrêter le chrono';
    canAct = true;
  } else {
    btn.textContent = 'Manche suivante →';
    hint = 'Le bouton s’active à la révélation.';
  }
  btn.disabled = !canAct || !s.hostOnline || !socket.connected || acting;
  $('hint').textContent = s.hostOnline ? hint : 'En attente de la reconnexion de l’écran hôte…';
}

$('action').onclick = () => {
  if (!socket.connected || !current || acting || $('action').disabled) return;
  acting = true;
  $('action').disabled = true;
  const event = current.state === 'lobby' ? 'remote:start' : current.state === 'answering' ? 'remote:stop' : 'remote:next';
  socket.timeout(GAME_ACK_MS).emit(event, { round: current.round }, (error, res) => {
    acting = false;
    if (!socket.connected || !code) return;
    if (error || !res?.state) return joinRoom();
    render(res.state);
  });
};

socket.on('connect', joinRoom);
socket.on('disconnect', () => {
  current = null;
  joining = null;
  acting = false;
  clearTimeout(retry);
  note('Connexion interrompue. Reconnexion automatique…');
});
socket.on('connect_error', () => note('Serveur inaccessible pour le moment. Nouvel essai automatique…'));
socket.on('remote:state', render);
socket.on('remote:closed', () => clearRoom('Le salon a été fermé.'));
reconnectWhenOnline(socket);
note('Connexion au jeu…');
socket.connect();
</script>
</body>
</html>
