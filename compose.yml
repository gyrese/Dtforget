# Serveur en ligne (VPS) : docker compose pull && docker compose up -d
services:
  dtforget:
    image: gyrese/dtforget:latest
    container_name: dtforget
    restart: unless-stopped
    environment:
      # Adresse publique du jeu, pour le QR code des téléphones (ex. https://dtforget.example.com)
      - PUBLIC_URL=${PUBLIC_URL}
      # Jeton qui autorise l'atelier du PC à envoyer des extraits (le même que PUBLISH_TOKEN sur le PC)
      - IMPORT_TOKEN=${IMPORT_TOKEN}
    networks:
      - nginx-proxy-network
    volumes:
      # Extraits, paroles et listes : sur le VPS uniquement, jamais dans l'image ni dans Git.
      - ./data:/srv/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  nginx-proxy-network:
    external: true
