# Serveur en ligne (VPS) : docker compose pull && docker compose up -d
services:
  dtforget:
    image: ghcr.io/gyrese/dtforget:latest
    container_name: dtforget
    restart: unless-stopped
    environment:
      # Adresse publique du jeu, pour le QR code des téléphones (ex. https://dtforget.example.com)
      - PUBLIC_URL=${PUBLIC_URL}
      # Jeton partagé avec le PC (PUBLISH_TOKEN dans son app/.env) : agent de traitement et envoi d'extraits
      - IMPORT_TOKEN=${IMPORT_TOKEN}
      # Code demandé pour ouvrir l'atelier en ligne (vide = atelier ouvert à tous)
      - ATELIER_PIN=${ATELIER_PIN:-}
    networks:
      - nginx-proxy-network
    volumes:
      # Extraits, paroles et listes : sur le VPS uniquement, jamais dans l'image ni dans Git.
      - ./data:/srv/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  nginx-proxy-network:
    external: true
