name: Docker Latest

# Publie l'image `latest` du serveur en ligne à chaque push sur main (ou à la main).
# Pas de déploiement automatique : sur le VPS, `docker compose pull && docker compose up -d`.
on:
  push:
    branches: [main]
    paths: [app/**, Dockerfile, .dockerignore, .github/workflows/docker-latest.yml]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Tests
        run: npm ci && npm test
        working-directory: app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dtforget:latest
